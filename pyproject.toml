[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lanedet"
version = "0.1.0"
description = "Classical lane detection for automated driving: thresholding, bird's-eye view, sliding-window polynomial fit, curvature and offset, temporal tracking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ishaan-giri" }]
keywords = ["lane detection", "computer vision", "opencv", "automated driving"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = [
    "matplotlib>=3.6",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
lanedet = "lanedet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["lanedet"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # line length is enforced by `ruff format`
